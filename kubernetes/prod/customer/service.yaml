apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: hsbc-prod

  labels:
    app.kubernetes.io/name: customer-service
    app.kubernetes.io/part-of: hsbc

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: customer-service

  ports:

    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
