apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customer-service
  namespace: hsbc-prod

  labels:
    app.kubernetes.io/name: customer-service
    app.kubernetes.io/part-of: hsbc

spec:
  scaleTargetRef:

    apiVersion: apps/v1
    kind: Deployment
    name: customer-service

  minReplicas: 3
  maxReplicas: 10

  behavior:

    scaleUp:
      stabilizationWindowSeconds: 60

      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 300

      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

  metrics:

    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource

      resource:
        name: memory

        target:
          type: Utilization
          averageUtilization: 75
